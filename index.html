<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram Stars</title>

  <!-- SDK Telegram: даёт window.Telegram.WebApp и CSS-переменные темы (--tg-theme-*) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Проигрыватель анимированных стикеров (.tgs это Lottie-анимация) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">

    <!-- Шапка: баланс в рублях -->
    <header class="header">
      <span class="header__label">Баланс</span>
      <span class="header__value" id="balance">0 ₽</span>
    </header>

    <!-- Анимированный стикер. Эмодзи внутри — заглушка, пока файла .tgs нет -->
    <div class="sticker sticker--big" data-tgs="assets/duck.tgs">🦆</div>

    <!-- Количество звёзд + быстрые варианты -->
    <section class="group">
      <label class="field">
        <span class="sticker sticker--icon" data-tgs="assets/star.tgs">⭐</span>
        <input id="amount" type="text" inputmode="numeric" autocomplete="off" maxlength="6"
               placeholder="Количество звёзд">
        <span class="field__hint" id="price"></span>
      </label>
      <div class="chips" id="chips"></div>
    </section>

    <!-- Получатель -->
    <label class="field">
      <span class="field__hint">@</span>
      <input id="username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             maxlength="32" placeholder="username">
      <button type="button" class="field__action" id="self">Себе</button>
    </label>

    <button type="button" class="submit" id="submit" disabled>Введите количество</button>
    <p class="status" id="status"></p>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
