<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Telegram Stars</title>

  <!-- SDK Telegram: даёт window.Telegram.WebApp и CSS-переменные темы (--tg-theme-*) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">

    <!-- Шапка: баланс и курс -->
    <header class="header">
      <div class="stat">
        <span class="caption">Баланс</span>
        <span class="stat__value" id="balance">0 ₽</span>
      </div>
      <div class="stat stat--right">
        <span class="caption">Курс</span>
        <span class="stat__value stat__value--regular" id="rate"></span>
      </div>
    </header>

    <!-- Количество: нажатие в любом месте блока ставит курсор в число -->
    <label class="hero">
      <span class="caption">Количество звёзд</span>
      <input class="hero__input" id="amount" type="text" inputmode="numeric" enterkeyhint="next"
             autocomplete="off" maxlength="6" placeholder="0">
      <span class="hero__hint" id="hint"></span>
    </label>

    <!-- Быстрый выбор -->
    <div class="chips" id="chips"></div>

    <!-- Получатель -->
    <label class="field">
      <span class="field__prefix">@</span>
      <input id="username" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off"
             spellcheck="false" maxlength="32" placeholder="username получателя">
      <button type="button" class="field__action" id="self">Себе</button>
    </label>

    <button type="button" class="submit" id="submit" disabled>
      <span>Купить</span>
      <span id="price">—</span>
    </button>
    <p class="status" id="status"></p>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
